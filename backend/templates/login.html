<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — OutfitCheck AI</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="glass auth-card">
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to your wardrobe</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%" id="login-btn">Sign In</button>
            </form>

            <p class="divider">Don't have an account? <a href="/register">Create one</a></p>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        if (getToken()) window.location.href = '/dashboard';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.textContent = 'Signing in...';
            btn.disabled = true;

            try {
                const data = await api('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                setToken(data.access_token);
                setUser(data.user);
                showToast('Welcome back!');
                setTimeout(() => window.location.href = '/dashboard', 500);
            } catch (err) {
                showToast(err.message, 'error');
                btn.textContent = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
